name: Frontend CI

'on':
  push:
    paths:
      - 'agronode/frontend/**'
      - 'agronode/.github/workflows/frontend-ci.yaml'
      - '.github/workflows/frontend-ci.yaml'
  pull_request:
    paths:
      - 'agronode/frontend/**'
      - 'agronode/.github/workflows/frontend-ci.yaml'
      - '.github/workflows/frontend-ci.yaml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agronode/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agronode/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
