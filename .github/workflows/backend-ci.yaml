name: Backend CI

'on':
  push:
    paths:
      - 'agronode/backend/**'
      - 'agronode/.tool-versions'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    paths:
      - 'agronode/backend/**'
      - 'agronode/.tool-versions'
      - '.github/workflows/backend-ci.yaml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agronode/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: agronode/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build API
        run: go build ./cmd/api
