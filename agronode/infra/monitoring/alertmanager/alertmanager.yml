global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service", "severity"]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: slack
      matchers:
        - notify="slack"

receivers:
  - name: default
  - name: slack
    slack_configs:
      - api_url: "http://example.invalid/webhook"
        channel: "#agronode-alerts"
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: >-
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
