global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: vernemq
    metrics_path: /metrics
    static_configs:
      - targets:
          - vernemq:8888
        labels:
          service: vernemq
