services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agronode-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - agronode-net

  postgres:
    image: postgres:16-alpine
    container_name: agronode-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agronode}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agronode-net

  backend:
    image: golang:1.24-alpine
    container_name: agronode-backend
    working_dir: /app
    command: ["sh", "-c", "echo 'Backend scaffold not implemented yet. AGN-7 will replace this.' && tail -f /dev/null"]
    environment:
      APP_PORT: ${BACKEND_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-agronode}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://mosquitto:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-agronode/#}
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
      - postgres
    networks:
      - agronode-net

  frontend:
    image: node:22-alpine
    container_name: agronode-frontend
    working_dir: /app
    command: ["sh", "-c", "echo 'Frontend scaffold not implemented yet. AGN-13 will replace this.' && tail -f /dev/null"]
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - agronode-net

networks:
  agronode-net:
    driver: bridge

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
