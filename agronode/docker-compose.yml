services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agronode-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - agronode-net

  postgres:
    image: postgres:16-alpine
    container_name: agronode-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agronode}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agronode-net

  backend:
    image: agronode-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agronode-backend
    environment:
      APP_PORT: ${BACKEND_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-agronode}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://mosquitto:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-agronode/#}
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
      - postgres
    networks:
      - agronode-net

  frontend:
    image: agronode-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agronode-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - agronode-net

  demo-device:
    image: eclipse-mosquitto:2
    container_name: agronode-demo-device
    profiles: ["demo"]
    environment:
      DEVICE_ID: ${DEMO_DEVICE_ID:-demo-device-1}
      PUBLISH_INTERVAL_SECONDS: ${DEMO_PUBLISH_INTERVAL_SECONDS:-15}
      MQTT_HOST: ${DEMO_MQTT_HOST:-mosquitto}
      MQTT_PORT: ${DEMO_MQTT_PORT:-1883}
    volumes:
      - ./infra/demo-device/publisher.sh:/demo/publisher.sh:ro
    command: ["sh", "/demo/publisher.sh"]
    depends_on:
      - mosquitto
    networks:
      - agronode-net

networks:
  agronode-net:
    driver: bridge

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
