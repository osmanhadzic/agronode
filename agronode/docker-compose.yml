services:
  vernemq:
    image: vernemq/vernemq:1.12.3
    container_name: agronode-vernemq
    restart: unless-stopped
    environment:
      DOCKER_VERNEMQ_ACCEPT_EULA: "yes"
      DOCKER_VERNEMQ_ALLOW_ANONYMOUS: "on"
      DOCKER_VERNEMQ_LISTENER__TCP__DEFAULT: "0.0.0.0:1883"
      DOCKER_VERNEMQ_PLUGINS__VMQ_PASSWD: "off"
      DOCKER_VERNEMQ_PLUGINS__VMQ_ACL: "on"
    ports:
      # MQTT
      - "1883:1883"
    volumes:
      - vernemq-data:/vernemq/data
      - ./infra/vernemq/vmq.acl:/vernemq/etc/vmq.acl:ro
    networks:
      - agronode-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: agronode-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - vernemq
    networks:
      - agronode-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: agronode-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - agronode-net

  postgres:
    image: postgres:16-alpine
    container_name: agronode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agronode}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agronode-net

  backend:
    image: agronode-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agronode-backend
    restart: unless-stopped
    environment:
      APP_PORT: ${BACKEND_PORT:-8080}

      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}

      FRONTEND_LOGIN_EMAIL: ${FRONTEND_LOGIN_EMAIL:-admin@agronode.local}
      FRONTEND_LOGIN_PASSWORD: ${FRONTEND_LOGIN_PASSWORD:-admin123}
      FRONTEND_ORGANIZATION_ID: ${FRONTEND_ORGANIZATION_ID:-1}
      FRONTEND_SESSION_TTL_HOURS: ${FRONTEND_SESSION_TTL_HOURS:-24}

      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-agronode}

      # VerneMQ
      MQTT_BROKER: ${MQTT_BROKER:-tcp://vernemq:1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-agronode/#}
      MQTT_ACTIVATION_TOPIC_TEMPLATE: ${MQTT_ACTIVATION_TOPIC_TEMPLATE:-agronode/%s/activation}

    ports:
      - "8080:8080"
    depends_on:
      - vernemq
      - postgres
    networks:
      - agronode-net

  frontend:
    image: agronode-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agronode-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - agronode-net

  demo-device:
    image: eclipse-mosquitto:2
    container_name: agronode-demo-device
    profiles:
      - demo
    environment:
      DEVICE_ID: ${DEMO_DEVICE_ID:-demo-device-1}
      PUBLISH_INTERVAL_SECONDS: ${DEMO_PUBLISH_INTERVAL_SECONDS:-15}

      # demo device connects to VerneMQ
      MQTT_HOST: ${DEMO_MQTT_HOST:-vernemq}
      MQTT_PORT: ${DEMO_MQTT_PORT:-1883}

    volumes:
      - ./infra/demo-device/publisher.sh:/demo/publisher.sh:ro

    command:
      - sh
      - /demo/publisher.sh

    depends_on:
      - vernemq

    networks:
      - agronode-net

networks:
  agronode-net:
    driver: bridge

volumes:
  postgres-data:
  vernemq-data:
  prometheus-data:
  grafana-data:
